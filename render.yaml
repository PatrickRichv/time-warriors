services:
  - type: web
    name: time-warriors
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: time-warriors-db
          property: connectionString
databases:
  - name: time-warriors-db
    plan: free
    databaseName: timewarriors
    user: timewarriors
